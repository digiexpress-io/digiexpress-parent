services:
  
  # Same PostgreSQL major version as the plain postgres:17 image, with pgvector
  # added for the metis search index.
  postgresql:
    image: pgvector/pgvector:pg17
    restart: always
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_PASSWORD=password123
      - POSTGRES_USER=eveli-app
      - TZ=Europe/Helsinki
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - ./_db/eveli_db_init:/docker-entrypoint-initdb.d
      - ./_db/eveli_db_data:/var/lib/postgresql/data

# metis AI models, needed when eveli.metis.enabled=true (any capability)
  ollama:
    image: ollama/ollama:latest
    restart: always
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_NUM_PARALLEL=4
    volumes:
      - ./_db/ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./compose/ollama-init.sh:/ollama-init.sh:ro
    entrypoint: ["/bin/sh", "/ollama-init.sh"]
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: "no"

# dialob related mess
  nginx:
    build: compose
    ports:
      - 9000:9000
    links:
      - dialob-service:dialob-service
      - dialob-session:dialob-session
    networks:
      - dialob-backend

  postgresql0dialob:
    image: postgres:17
    restart: on-failure
    ports:
      - 5436:5432
    environment:
      - POSTGRES_PASSWORD=dialob123
      - POSTGRES_USER=dialob
      - TZ=Europe/Helsinki

    volumes:
      - ./_db/dialob_db_init:/docker-entrypoint-initdb.d
      - ./_db/dialob_db_data:/var/lib/postgresql/data
    networks:
      - dialob-backend

  redis:
    image: redis:4.0-alpine
    restart: on-failure
    networks:
      - dialob-backend

  dialob-service:
    image: resys/dialob-boot:2.4.3
    restart: no
    ports:
      - 8081:8081
    environment:
      - SPRING_REDIS_HOST=redis
      - SPRING_PROFILES_ACTIVE=ui,jdbc,cors
      - SPRING_SESSION_STORE_TYPE=redis
      - SPRING_SESSION_REDIS_NAMESPACE=dialobServiceSession
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgresql0dialob/dialob
      - SPRING_DATASOURCE_USERNAME=dialob
      - SPRING_DATASOURCE_PASSWORD=dialob123
      - ADMIN_VERSIONING=true
      - DIALOB_SESSION_POSTSUBMITHANDLER_ENABLED=true
      - DIALOB_SECURITY_ENABLED=false
      - SERVER_SERVLET_CONTEXTPATH=/dialob
      - LOGGING_LEVEL_IO_DIALOB=INFO
      - SPRING_CLOUD_GCP_CORE_ENABLED=false
      - SPRING_CLOUD_GCP_LOGGING_ENABLED=false
      - DIALOB_TENANT_MODE=URL_PARAM
      - DIALOB_TENANT_FIXED_ID=00000000-0000-0000-0000-000000000000
      - QUESTIONNAIRE_REST_URL=/session/dialob
      - COMPOSER_ADMINAPPURL=/secured/en/assets/forms
#     - COMPOSER_FILLING_APP_URL=http://localhost:3001/secured/fi/forms
      - COMPOSER_FILLING_APP_URL=http://localhost:3000/secured/en/assets/forms
      - COMPOSER_TENANTS_DEFAULT_TEMPLATE=https://cdn.resys.io/dialob/composer-material/dev/index.html
    networks:
      - dialob-backend

  dialob-session:
    image: resys/dialob-session-boot:2.4.3
    restart: no
    ports:
      - 8082:8082
    environment:
      - SERVER_PORT=8082
      - SPRING_REDIS_HOST=redis
      - SPRING_PROFILES_ACTIVE=jdbc,cors
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgresql0dialob/dialob
      - SPRING_DATASOURCE_USERNAME=dialob
      - SPRING_DATASOURCE_PASSWORD=dialob123
      - DIALOB_SESSION_POSTSUBMITHANDLER_ENABLED=true
      - SPRING_CLOUD_GCP_CORE_ENABLED=false
    volumes:
      - ./_db/dialob-session-config:/java/config/
    networks:
      - dialob-backend

  # feedback analyzer
  # feedback-analyzer:
  #  build:
  #    context: ../../../py_setup/feedback-analyzer
  #    dockerfile: Dockerfile
  #  container_name: feedback-analyzer
  #  restart: always
  #  ports:
  #    - "8083:8000"

  # tagomi pdf compiler
  tagomi-pdf:
    build:
      context: ../../../rust_setup/crates/tagomi-pdf
      dockerfile: Dockerfile
    container_name: tagomi-pdf
    ports:
      - "8085:8085"
    environment:
      - FONTS_PATH=/app/assets/fonts
      - USE_SYSTEM_FONTS=true
    volumes:
      - ../../../rust_setup/crates/tagomi-pdf/assets/fonts:/app/assets/fonts:ro
    restart: always

networks:
  dialob-backend:
    external: false