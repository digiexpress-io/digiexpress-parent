spring:
  config.activate.on-profile: 'dev'
  jpa:
    showSql: false
    generateDdl: false
    hibernate:
      ddlAuto: "validate"
      autoQuoteKeyword: true
      connection:
        useUnicode: true
        characterEncoding: 'UTF-8'
        charSet: 'UTF-8'
  flyway:
    enabled: true
    locations: classpath:db/postgresql
    validate-on-migrate: true
  ai:
    # Repeated from application.yml because spring-boot:run pins spring.config.location
    # to the profile files only, so the base application.yml is not read locally.
    # ollama: the ollama service from eveli-local-docker. google-genai: Gemini on Vertex AI, see
    # eveli.metis.google-genai below. Chat and embedding can be set independently.
    model:
      chat: ollama        # or google-genai
      embedding: ollama   # or google-genai
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2
          temperature: 0.2
      embedding:
        options:
          model: bge-m3

management:
  server:
    servlet.context-path: "/manage"
    add-application-context-header: false
  endpoints:
    web:
      exposure:
        include: "health,mappings"

