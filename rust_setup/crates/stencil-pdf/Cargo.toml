[package]
name = "typst-rest-api"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = "0.8.4"
tokio = { version = "1.0", features = ["full"] }
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["cors", "fs"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Typst dependencies
typst = "0.13.1"
typst-library = "0.13.1"
typst-pdf = "0.13.1"
typst-kit = "0.13.1"

# Error handling
anyhow = "1.0.100"

thiserror = "2.0.16"

ecow = "0.2"


# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# File handling
tempfile = "3.0"
base64 = "0.22"