[package]
name = "tagomi-pdf"
version = "0.1.3"
edition = "2021"

[dependencies]
# Web framework
axum = "0.8.6"
tokio = { version = "1.48.0", features = ["full"] }
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["cors", "fs"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"

# Typst dependencies
typst = "0.13"
typst-library = "0.13"
typst-pdf = "0.13"
typst-kit = "0.13"

# Error handling
anyhow = "1.0.100"
thiserror = "2.0.17"

# Type utils
ecow = "0.2"
itertools = "0.14"
chrono = { version = "0.4", features = ["serde"] }
lazy_static = "1.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# File handling
tempfile = "3.23.0"
base64 = "0.22"

# HTTPS/TLS support
axum-server = { version = "0.7", features = ["tls-openssl"] }