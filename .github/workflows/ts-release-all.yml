on:
  push:
    paths:
      - 'ts_setup/**'

    branches:
      - dev
  workflow_call: # Enables manual triggering
  workflow_dispatch: #manual trigger
permissions:
  contents: write
  id-token: write
    
name: Release all ts projects
jobs:
    build:
      runs-on: ubuntu-latest  # windows-latest || macos-latest
      defaults:
        run:
          working-directory: ts_setup
      env:
        NODE_ENV: test
        CI: true
        
      name: Release Gamut into NPMJS 
      steps:
        - uses: actions/checkout@v4

        - uses: pnpm/action-setup@v2
          name: install pnpm
          with:
            version: 10

        - uses: actions/setup-node@v4
          with:
            node-version: 22
            cache: 'pnpm'
            cache-dependency-path: ts_setup/pnpm-lock.yaml
            registry-url: 'https://registry.npmjs.org/'

        - name: Install dependencies 📦
          run: pnpm install --frozen-lockfile
#        - name: Test
#          run: pnpm test -r

        - name: Run 'release-all.sh'  
          run: ./.release-scripts/release-all.sh
          env:
            CI: false # 
            BOT_EMAIL: jocelyn.mutso@resys.io 
            BOT_NAME: jocelyn.mutso
            NODE_AUTH_TOKEN: ${{ secrets.NPMJS_TOKEN }}
